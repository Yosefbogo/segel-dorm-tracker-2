<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    /* --- CORE THEME VARIABLES --- */
    :root {
      --bg-color: #f5f7fb;
      --text-color: #333333;
      --card-bg: #ffffff;
      --header-color: #1a73e8;
      --border-color: #d2e3fc;
      --shadow: rgba(0,0,0,0.08);
      --saved-bg: rgba(0, 0, 0, 0.05);
      --grid-empty-border: #cbd5e1;
      --grid-empty-bg: transparent;
      --grid-fill-color: #34d399;
      --grid-done-bg: #10b981;
      --grid-done-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --card-bg: #1e293b;
      --header-color: #38bdf8;
      --border-color: #334155;
      --shadow: rgba(0,0,0,0.3);
      --saved-bg: rgba(255, 255, 255, 0.1);
      --grid-empty-border: #475569;
      --grid-empty-bg: #1e293b;
      --grid-fill-color: #0ea5e9;
      --grid-done-bg: #0284c7;
      --grid-done-text: #ffffff;
    }

    body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding: 16px; color: var(--text-color); transition: background 0.3s, color 0.3s; overflow-x: hidden; }
    
    /* --- STICKY TOP CONTROLS --- */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--card-bg);
      padding: 12px 16px;
      margin: -16px -16px 16px -16px;
      box-shadow: 0 2px 8px var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: background 0.3s;
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .stats-container { display: flex; flex-direction: column; gap: 4px; }
    .stats-text { font-size: 14px; font-weight: 700; }
    .progress-box { width: 120px; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: #137333; transition: width 0.3s ease; }
    
    /* --- SLIM ROW SINGLE-LINE DASHBOARD GRID --- */
    .room-grid {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      gap: 4px;
      width: 100%;
      padding-top: 6px;
      border-top: 1px solid var(--border-color);
    }
    .grid-square {
      position: relative;
      flex: 1;
      height: 34px;
      min-width: 0; 
      border-radius: 5px;
      border: 1.5px solid var(--grid-empty-border);
      background-color: var(--grid-empty-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      overflow: hidden;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    .grid-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background-color: var(--grid-fill-color);
      opacity: 0.35;
      transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }
    .grid-label { position: relative; z-index: 2; }
    
    .grid-square.room-done {
      background-color: var(--grid-done-bg) !important;
      border-color: var(--grid-done-bg) !important;
      color: var(--grid-done-text) !important;
    }

    /* Dark Mode Toggle Switch */
    .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .theme-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #38bdf8; }
    input:checked + .slider:before { transform: translateX(24px); }

    h2 { text-align: center; color: var(--header-color); margin-top: 8px; margin-bottom: 16px; }

    /* --- ROOM HEADERS --- */
    .room-header {
      font-size: 18px;
      font-weight: 800;
      color: var(--header-color);
      margin-top: 24px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }
    .room-header.completed { color: #10b981 !important; border-bottom-color: #a7f3d0; }
    .room-remaining-tag { font-size: 13px; font-weight: 600; color: var(--archive-header); margin-left: 6px; }
    
    .room-actions { display: flex; gap: 12px; align-items: center; }
    .btn-bulk { background: var(--saved-bg); border: none; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; color: var(--text-color); cursor: pointer; }

    /* --- STUDENT ROWS (Removed disappearing animations) --- */
    .student-row { 
      background: var(--card-bg); 
      border-radius: 8px; 
      padding: 10px 12px; 
      margin-bottom: 8px;
      box-shadow: 0 1px 3px var(--shadow); 
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid transparent;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
      user-select: none;
    }
    .student-name { font-size: 16px; font-weight: 600; }
    
    /* Live State Colors */
    .row-success { background-color: #e6f4ea !important; border: 1px solid #137333 !important; color: #137333; }
    .row-late { background-color: #fef7e0 !important; border: 1px solid #b06000 !important; color: #b06000; }
    .row-absent { background-color: #fce8e6 !important; border: 1px solid #c5221f !important; color: #c5221f; }
    
    [data-theme="dark"] .row-success { background-color: #064e3b !important; border: 1px solid #059669 !important; color: #a7f3d0; }
    [data-theme="dark"] .row-late { background-color: #78350f !important; border: 1px solid #d97706 !important; color: #fde68a; }
    [data-theme="dark"] .row-absent { background-color: #7f1d1d !important; border: 1px solid #dc2626 !important; color: #fca5a5; }

    .btn-container { display: flex; gap: 8px; }
    button { border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; touch-action: manipulation; }
    .btn-on-time { background-color: #e6f4ea; color: #137333; }
    .btn-late { background-color: #fef7e0; color: #b06000; }
    
    [data-theme="dark"] .btn-on-time { background-color: #064e3b; color: #a7f3d0; }
    [data-theme="dark"] .btn-late { background-color: #78350f; color: #fde68a; }

    .saved-text { font-size: 13px; font-weight: bold; padding: 8px 12px; background: var(--saved-bg); border-radius: 6px; text-align: right; }
    #loading { text-align: center; margin-top: 50px; color: #666; font-weight: bold;}
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-row">
      <div class="stats-container">
        <div class="stats-text" id="stats-counter">0 / 0 Done</div>
        <div class="progress-box"><div class="progress-bar" id="stats-progress"></div></div>
      </div>
      <div>
        <label class="theme-switch">
          <input type="checkbox" id="theme-toggle" onclick="toggleTheme()">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    
    <div class="room-grid" id="dashboard-grid"></div>
  </div>

  <h2>Lights Out</h2>
  <div id="loading">Loading Rooms...</div>
  
  <div id="roster-container"></div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyA6mUrZ3cLtql5vVPhN6BHc3C1mSIj6oQwJTgScSWVNhtByfrX6pvh4YTYPvNEomSciA/exec";
    let globalStudents = [];

    function vibeLight() { if (navigator.vibrate) navigator.vibrate(15); }
    function vibeDouble() { if (navigator.vibrate) navigator.vibrate([40, 40, 40]); }
    function vibeUndo() { if (navigator.vibrate) navigator.vibrate(30); }

    window.onload = function() {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-toggle').checked = true;
      }
      
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getRoster" })
      })
      .then(res => res.json())
      .then(data => {
        globalStudents = data;
        buildDashboardGrid(); 
        renderStaticRoster();
      });
    };

    function toggleTheme() {
      vibeLight();
      if (document.getElementById('theme-toggle').checked) {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      }
    }

    function buildDashboardGrid() {
      const gridContainer = document.getElementById('dashboard-grid');
      gridContainer.innerHTML = '';
      
      let distinctRooms = [...new Set(globalStudents.map(s => s.room))].sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));
      
      distinctRooms.forEach(roomNum => {
        const square = document.createElement('div');
        square.className = 'grid-square';
        square.id = 'grid-sq-' + roomNum;
        
        square.innerHTML = `
          <div class="grid-fill" id="grid-fill-${roomNum}"></div>
          <span class="grid-label" id="grid-label-${roomNum}">${roomNum}</span>
        `;
        gridContainer.appendChild(square);
      });
    }

    function calculateStats() {
      const total = globalStudents.length;
      const marked = globalStudents.filter(s => s.loggedTime && s.loggedTime !== "").length;
      
      document.getElementById('stats-counter').innerText = `${marked} / ${total} Completed`;
      const percentage = total > 0 ? (marked / total) * 100 : 0;
      document.getElementById('stats-progress').style.width = percentage + '%';
      
      updateDashboardProgress();
    }

    function updateDashboardProgress() {
      let roomMetrics = {};
      globalStudents.forEach(s => {
        if (!roomMetrics[s.room]) roomMetrics[s.room] = { total: 0, marked: 0 };
        roomMetrics[s.room].total++;
        if (s.loggedTime && s.loggedTime !== "") roomMetrics[s.room].marked++;
      });

      Object.keys(roomMetrics).forEach(roomNum => {
        const fillEl = document.getElementById(`grid-fill-${roomNum}`);
        const squareEl = document.getElementById(`grid-sq-${roomNum}`);
        const labelEl = document.getElementById(`grid-label-${roomNum}`);
        
        if (fillEl && squareEl && labelEl) {
          let m = roomMetrics[roomNum];
          let fillPercent = (m.marked / m.total) * 100;
          
          fillEl.style.height = fillPercent + '%';
          labelEl.innerText = roomNum; 
          
          if (m.marked === m.total) {
            squareEl.className = 'grid-square room-done';
          } else {
            squareEl.className = 'grid-square';
          }
        }
      });
    }

    function renderStaticRoster() {
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('roster-container');
      container.innerHTML = '';
      
      let roomMetrics = {};
      globalStudents.forEach(s => {
        if (!roomMetrics[s.room]) roomMetrics[s.room] = { total: 0, marked: 0 };
        roomMetrics[s.room].total++;
        if (s.loggedTime && s.loggedTime !== "") roomMetrics[s.room].marked++;
      });

      let distinctRooms = [...new Set(globalStudents.map(s => s.room))].sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));

      distinctRooms.forEach(roomNum => {
        let metrics = roomMetrics[roomNum];
        let roomKids = globalStudents.filter(s => s.room === roomNum).sort((a,b) => a.name.localeCompare(b.name));
        
        const header = document.createElement('div');
        header.className = 'room-header';
        header.id = 'room-hdr-' + roomNum;
        if (metrics.marked === metrics.total) {
          header.classList.add('completed');
        }
        
        header.innerHTML = `
          <span>Room ${roomNum} <span class="room-remaining-tag" id="ratio-static-${roomNum}">(${metrics.marked}/${metrics.total} Done)</span></span>
          <div class="room-actions">
            <button class="btn-bulk" onclick="bulkMarkRoom('${roomNum}')">⚡ Bulk On Time</button>
          </div>
        `;
        container.appendChild(header);

        roomKids.forEach(student => {
          let origIndex = globalStudents.findIndex(s => s.name === student.name);
          
          const row = document.createElement('div');
          row.className = 'student-row';
          row.id = 'row-' + origIndex;
          
          let safeName = student.name.replace(/'/g, "\\'").replace(/"/g, "&quot;");
          let actionHtml = '';
          
          // In static mode, if marked, render inline Undo right on the row
          if (student.loggedTime && student.loggedTime !== "") {
             row.setAttribute('onpointerdown', `startUndoPress('${safeName}', ${origIndex})`);
             row.setAttribute('onpointerup', `endUndoPress()`);
             row.setAttribute('onpointerleave', `cancelUndoPress()`);
             row.setAttribute('onpointercancel', `cancelUndoPress()`);
             row.setAttribute('oncontextmenu', 'return false;');
             
             actionHtml = `<div class="saved-text">${student.loggedTime}</div>`;
             if (student.loggedTime === "On Time") row.classList.add('row-success');
             else if (student.loggedTime === "Absent") row.classList.add('row-absent');
             else row.classList.add('row-late');
          } else {
             actionHtml = `
              <div class="btn-container" id="btns-${origIndex}">
                <button class="btn-on-time" 
                        onpointerdown="startMarkPress('${safeName}', ${origIndex})" 
                        onpointerup="endMarkPress('${safeName}', 'on_time', ${origIndex})" 
                        onpointerleave="cancelMarkPress()" 
                        onpointercancel="cancelMarkPress()"
                        oncontextmenu="return false;">On Time</button>
                <button class="btn-late" onclick="logTime('${safeName}', 'late', ${origIndex})">Log Time</button>
              </div>
             `;
          }

          row.innerHTML = `
            <div class="student-name">${student.name}</div>
            <div id="action-holder-${origIndex}">${actionHtml}</div>
          `;
          container.appendChild(row);
        });
      });

      calculateStats();
    }

    let markTimer;
    let isMarkLongPress = false;

    function startMarkPress(name, index) {
      isMarkLongPress = false;
      markTimer = setTimeout(() => {
        isMarkLongPress = true;
        vibeDouble();
        logTime(name, 'absent', index);
      }, 500); 
    }
    function endMarkPress(name, type, index) {
      clearTimeout(markTimer);
      if (!isMarkLongPress) {
        vibeLight();
        logTime(name, type, index); 
      }
    }
    function cancelMarkPress() { clearTimeout(markTimer); }

    let undoTimer;
    let isUndoLongPress = false;

    function startUndoPress(name, index) {
      isUndoLongPress = false;
      undoTimer = setTimeout(() => {
        isUndoLongPress = true;
        vibeUndo();
        undoTap(name, index);
      }, 600); 
    }
    function endUndoPress() { clearTimeout(undoTimer); }
    function cancelUndoPress() { clearTimeout(undoTimer); }

    function logTime(name, type, index) {
      let match = globalStudents[index];
      const targetRow = document.getElementById('row-' + index);
      const holder = document.getElementById('action-holder-' + index);
      
      if (type === 'late') vibeLight();
      
      if (targetRow && holder) {
        holder.innerHTML = `<div class="saved-text">...</div>`;
        targetRow.className = 'student-row';
        if (type === 'on_time') targetRow.classList.add('row-success');
        else if (type === 'absent') targetRow.classList.add('row-absent');
        else targetRow.classList.add('row-late');
      }
      
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "logTime", name: name, type: type })
      })
      .then(res => res.json())
      .then(data => {
        match.loggedTime = data.time;
        
        // Static repaint without breaking list positioning layout
        let safeName = name.replace(/'/g, "\\'").replace(/"/g, "&quot;");
        if (targetRow) {
          targetRow.setAttribute('onpointerdown', `startUndoPress('${safeName}', ${index})`);
          targetRow.setAttribute('onpointerup', `endUndoPress()`);
          targetRow.setAttribute('onpointerleave', `cancelUndoPress()`);
          targetRow.setAttribute('onpointercancel', `cancelUndoPress()`);
        }
        if (holder) holder.innerHTML = `<div class="saved-text">${data.time}</div>`;
        
        updateInlineRatio(match.room);
        calculateStats();
      });
    }

    function updateInlineRatio(roomNum) {
      let total = globalStudents.filter(s => s.room === roomNum).length;
      let marked = globalStudents.filter(s => s.room === roomNum && s.loggedTime && s.loggedTime !== "").length;
      const tag = document.getElementById('ratio-static-' + roomNum);
      const header = document.getElementById('room-hdr-' + roomNum);
      
      if (tag) tag.innerText = `(${marked}/${total} Done)`;
      if (header) {
        if (marked === total) header.classList.add('completed');
        else header.classList.remove('completed');
      }
    }

    function undoTap(name, index) {
      let match = globalStudents[index];
      match.loggedTime = "";
      
      // Immediately restore inline row buttons on undo reset
      const targetRow = document.getElementById('row-' + index);
      const holder = document.getElementById('action-holder-' + index);
      
      if (targetRow) {
        targetRow.className = 'student-row';
        targetRow.removeAttribute('onpointerdown');
        targetRow.removeAttribute('onpointerup');
        targetRow.removeAttribute('onpointerleave');
        targetRow.removeAttribute('onpointercancel');
      }
      
      let safeName = name.replace(/'/g, "\\'").replace(/"/g, "&quot;");
      if (holder) {
        holder.innerHTML = `
          <div class="btn-container" id="btns-${index}">
            <button class="btn-on-time" 
                    onpointerdown="startMarkPress('${safeName}', ${index})" 
                    onpointerup="endMarkPress('${safeName}', 'on_time', ${index})" 
                    onpointerleave="cancelMarkPress()" 
                    onpointercancel="cancelMarkPress()"
                    oncontextmenu="return false;">On Time</button>
            <button class="btn-late" onclick="logTime('${safeName}', 'late', ${index})">Log Time</button>
          </div>
        `;
      }
      
      updateInlineRatio(match.room);
      calculateStats();

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "clearRow", name: name })
      });
    }

    function bulkMarkRoom(roomNum) {
      vibeLight();
      let unmarkedInRoom = globalStudents.filter(s => s.room === roomNum && (!s.loggedTime || s.loggedTime === ""));
      
      unmarkedInRoom.forEach((student) => {
        let origIndex = globalStudents.findIndex(s => s.name === student.name);
        logTime(student.name, 'on_time', origIndex);
      });
    }
  </script>
</body>
</html>
